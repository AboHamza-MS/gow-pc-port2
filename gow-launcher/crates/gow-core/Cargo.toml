[package]
name = "gow-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
md-5 = "0.11.0"
# The recompiler's own ELF reader (RustPortPS2), used for the structural report.
ps2-elf = { path = "../../../RustPortPS2/crates/ps2-elf" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Credentials", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_XboxController", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi"] }
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

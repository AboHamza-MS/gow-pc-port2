[package]
name = "ps2-tools"
description = "The installer's helper tools: ELF identity, disc extraction, VU1 microcode images and the AOT code generators"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ps2-tools"
path = "src/main.rs"

[dependencies]
lzma-rs = { version = "0.3", features = ["raw_decoder"] }
miniz_oxide = "0.8"
ps2-elf.workspace = true
ps2-parity.workspace = true
ruzstd = { version = "0.8", default-features = false, features = ["std"] }

[dev-dependencies]
tempfile = "3"
